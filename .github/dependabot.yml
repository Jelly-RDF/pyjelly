version: 2
updates:
- package-ecosystem: gitsubmodule
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    actions:
      patterns:
        - "*"
# Only the uv ecosystem: it updates pyproject.toml AND uv.lock atomically,
# which is required by our `uv sync --locked` CI. The pip ecosystem edited
# pyproject.toml without touching uv.lock, breaking `--locked` and stalling PRs.
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
  groups:
    production:
      dependency-type: production
    development:
      dependency-type: development
